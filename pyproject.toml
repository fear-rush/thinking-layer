[project]
name = "thinking-layer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "liteparse>=2.4.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pypdfium2>=5.11.0",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0b1",
    "ruff>=0.15,<0.16",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ARG", "B", "C4", "PIE", "RET", "RUF", "SIM"]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
"thinking_layer/api/routers/*.py" = ["B008"]
