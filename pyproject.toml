[project]
name = "thinking-layer"
version = "0.1.0"
description = "Citation-first retrieval for Indonesian financial regulations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "liteparse==2.4.0",
    "markdown-it-py>=4.2.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0b1",
    "pytest>=9.1.1",
    "ruff>=0.15,<0.16",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ARG", "B", "C4", "PIE", "RET", "RUF", "SIM"]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
"thinking_layer/api/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=prepend"]
