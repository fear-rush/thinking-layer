[project]
name = "thinking-layer"
version = "0.1.0"
description = "Source research for Indonesian financial regulations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15,<0.16",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ARG", "B", "C4", "PIE", "RET", "RUF", "SIM"]
allowed-confusables = ["×", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=prepend"]
